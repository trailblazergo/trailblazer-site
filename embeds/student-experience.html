<meta name="robots" content="noindex"><base target="_top">
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --green: #0b962e;
      --dark-green: #08661f;
      --black: #111111;
      --charcoal: #2a2a2a;
      --white: #ffffff;
      --border: #d7e7db;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: var(--black);
      font-family:
        "Google Sans Flex",
        "Google Sans",
        Arial,
        Helvetica,
        sans-serif;
    }

    .student-experience {
      width: 100%;
      padding: 26px 22px;
      background: transparent;
    }

    .student-experience__content {
      width: min(470px, 100%);
      margin: 0 auto;
    }

    .student-experience__label {
      margin: 0 0 9px;
      color: var(--green);
      font-size: 11px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .student-experience__title {
      margin: 0;
      font-size: clamp(29px, 4vw, 39px);
      line-height: 1.08;
      letter-spacing: -0.035em;
      font-weight: 700;
    }

    .student-experience__title span {
      color: var(--green);
    }

    .student-experience__copy {
      margin: 16px 0 0;
      color: var(--charcoal);
      font-size: 15px;
      line-height: 1.56;
    }

    .student-experience__list {
      display: grid;
      gap: 11px;
      padding: 0;
      margin: 21px 0 0;
      list-style: none;
    }

    .student-experience__list li {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 9px;
      align-items: start;
      color: var(--charcoal);
      font-size: 14px;
      line-height: 1.45;
    }

    .student-experience__check {
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      margin-top: 1px;
      border-radius: 50%;
      background: var(--green);
      color: var(--white);
      font-size: 10px;
      font-weight: 700;
    }

    @media (max-width: 560px) {
      html,
      body {
        overflow: visible;
      }

      .student-experience {
        padding: 22px 18px;
      }

      .student-experience__title {
        font-size: 32px;
      }
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }
  
    /* wave 1022: slightly larger checks + text */ .student-experience__list li{grid-template-columns:21px 1fr;gap:10px;font-size:16px} .student-experience__check{width:21px;height:21px;font-size:12px}
  </style>

-size:19px!important;font-family:Caveat,cursive;font-weight:700}</style></head>

<body>
  <section class="student-experience">
    <div class="student-experience__content">

      <p class="student-experience__label">
        College list
      </p>

      <h3 class="student-experience__title">
        Students receive a personalized college list <span>based on their interests and goals.</span>
      </h3>

      <ul class="student-experience__list">
        <li>
          <span class="student-experience__check">✓</span>
          <span>Build a college shortlist</span>
        </li>
        <li>
          <span class="student-experience__check">✓</span>
          <span>Compare colleges</span>
        </li>
        <li>
          <span class="student-experience__check">✓</span>
          <span>Discover peer advisors at shortlisted colleges</span>
        </li>
      </ul>

    </div>
  </section>
</body>
</html>
